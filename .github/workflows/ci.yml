name: CI

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build rho-coding-agent on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Build rho-coding-agent
        run: cargo build --release --bin rho
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rho-coding-agent-windows
          path: target/release/rho.exe
